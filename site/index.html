<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>scRNA-seq Protocol Benchmark: Replication Dashboard</title>
<style>
:root{
 --bg:#fbe7ec;--fg:#1d1d1b;--mut:#67665f;--card:#ffffff;--bd:#e4e3da;--bd2:#d3d2c7;
 --ac:#0e6b54;--ac-soft:#e2f2ec;--ac2:#d85a30;--warn:#a32d2d;--wbg:#fcebeb;--grid:#dcdcd2;
 --shadow:0 1px 2px rgba(30,30,20,.05),0 4px 14px rgba(30,30,20,.06);
 --r:14px;--font:system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media(prefers-color-scheme:dark){:root{
 --bg:#141412;--fg:#ebe9e2;--mut:#a09e93;--card:#1f1f1b;--bd:#33322c;--bd2:#45443a;
 --ac:#63cfa4;--ac-soft:#14332a;--ac2:#f08a5c;--warn:#f09595;--wbg:#3b1d1d;--grid:#3a3931;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.62 var(--font);-webkit-font-smoothing:antialiased}
/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.topbar-in{max-width:1140px;margin:auto;padding:14px 22px 0}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));flex:none}
h1{font-size:21px;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12.5px;margin:2px 0 0}
.sub a{color:var(--ac);text-decoration:none}.sub a:hover{text-decoration:underline}
nav{display:flex;gap:6px;overflow-x:auto;margin:12px 0 0;padding-bottom:10px;scrollbar-width:thin}
nav button,select{font:600 13px var(--font);color:var(--fg);background:var(--card);border:1px solid var(--bd2);border-radius:999px;padding:7px 15px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
nav button:hover{border-color:var(--ac)}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.spec{display:flex;gap:6px;margin:10px 0 0}.spec button{font:600 13px var(--font);color:var(--fg);background:var(--card);border:1px solid var(--bd2);border-radius:999px;padding:6px 16px;cursor:pointer}.spec button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{max-width:1140px;margin:auto;padding:26px 22px 40px;min-height:60vh}
/* ---------- sections & cards ---------- */
#view h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:30px 0 10px;padding-left:12px;border-left:3px solid var(--ac)}
#view h2:first-child{margin-top:6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.figcap{font-size:13px;color:var(--mut);margin:10px 0 0;border-top:1px dashed var(--bd);padding-top:8px}
.figcap b{color:var(--fg)}
.mut{color:var(--mut);font-size:13px}
a{color:var(--ac)}
/* hero */
.hero{background:linear-gradient(135deg,var(--ac-soft),var(--card) 70%);border:1px solid var(--bd);border-radius:calc(var(--r) + 4px);padding:22px 24px;margin-bottom:6px;box-shadow:var(--shadow)}
.hero h2{border:none!important;padding:0!important;margin:0 0 6px!important;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--ac)}
.hero p{margin:6px 0;font-size:15px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.kpi{margin:0!important}
.kpi span.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;margin-top:2px}
.kpi small{color:var(--mut);font-size:12px}
/* alerts */
.warn{background:var(--wbg);color:var(--warn);border:1px solid var(--warn);border-radius:12px;padding:12px 16px;margin:14px 0;font-weight:600}
.note{border-left:4px solid var(--ac)}
.empty{border:1.5px dashed var(--bd2);border-radius:12px;padding:14px 16px;color:var(--mut);font-size:13.5px;margin:10px 0}
/* bars & rows */
.row{display:grid;grid-template-columns:170px 1fr 90px;gap:12px;align-items:center;margin:7px 0;font-size:13.5px}
.bar{height:14px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 60%,var(--ac2)))}
.stack{display:flex;height:18px;border-radius:8px;overflow:hidden;border:1px solid var(--bd)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
thead th, tr:first-child th{position:sticky;top:0;background:var(--card)}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
th[data-k]{cursor:pointer}th[data-k]:hover{color:var(--ac)}
tbody tr:hover, tr:hover td{background:color-mix(in srgb,var(--ac-soft) 40%,transparent)}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.wrap.card{padding:6px 10px}
.wrap table{margin:6px 0}
/* charts */
svg.chart{width:100%;height:auto;display:block;font-size:12px}
svg.chart text{fill:var(--mut);font-family:var(--font)}
svg.chart .grid{stroke:var(--grid);stroke-width:.7}
canvas{width:100%;height:440px;display:block;cursor:crosshair;border-radius:10px}
.lg{margin-top:10px}.lg span{display:inline-flex;align-items:center;gap:6px;margin:3px 12px 3px 0;font-size:12.5px;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:2px 10px 2px 4px}
.lg i{width:12px;height:12px;border-radius:50%}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:8px;padding:4px 10px;font-size:12px;display:none;z-index:5;font-weight:600}
/* controls */
.btn{font:600 12.5px var(--font);color:var(--ac);background:var(--ac-soft);border:1px solid transparent;border-radius:8px;padding:6px 14px;cursor:pointer;margin-top:10px}
.btn:hover{border-color:var(--ac)}
select#sp,select#sc{border-radius:10px}
.pill{display:inline-block;border:1px solid var(--bd2);background:var(--bg);border-radius:999px;padding:1px 11px;font-size:11.5px;margin:2px 4px 2px 0;color:var(--mut)}
details{margin:10px 0;font-size:13px;color:var(--mut)}
details summary{cursor:pointer;color:var(--ac);font-weight:600}
code{font-family:var(--mono);font-size:.88em;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 6px}
.figbox{border:1.5px solid var(--bd2);border-radius:10px;padding:14px 12px 6px;background:var(--bg);margin:4px 0 8px}
.figbox svg.chart,.figbox canvas{margin:0}
/* footer */
.footer{max-width:1140px;margin:0 auto;padding:0 22px 60px;color:var(--mut);font-size:12.5px}
.footer-in{border-top:1px solid var(--bd);padding-top:14px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
/* two-col grids for wide screens */
@media(min-width:900px){.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2>.card{margin-bottom:0}}
@media(max-width:640px){.row{grid-template-columns:110px 1fr 64px}h1{font-size:18px}main{padding:18px 14px 30px}}
@media print{.topbar{position:static}nav,.btn{display:none}.card{box-shadow:none;break-inside:avoid}}
</style>
</head><body><header class="topbar"><div class="topbar-in">
<div class="brand"><div class="mark"></div><div><h1>scRNA-seq protocol benchmark</h1>
<div class="sub">Partial replication of Mereu, Lafzi et al., Nat Biotechnol 38:747 (2020) · <a href="https://doi.org/10.1038/s41587-020-0469-4">paper</a> · <a href="https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE133549">GSE133549</a> · <a href="https://github.com/ati-lz/HCA_Benchmarking">authors' R code</a> · <a href="methodology.html"><b>how it works</b></a></div></div></div>
<div class="spec" id="spec"><button data-s="human" class="on">Human</button><button data-s="mouse">Mouse</button></div><nav id="tabs"></nav></div></header><main><div id="view"></div>
</main><footer class="footer"><div class="footer-in"><span>Replication dashboard · Mereu et al. 2020 · GEO GSE133549</span><span><a href="methodology.html">Methodology</a> · <a href="data/results.json">results.json</a> · <a href="?demo">demo mode</a></span></div></footer>
<script src="data/results.js"></script>
<script src="data/demo.js"></script>
<script src="data/results_mouse.js"></script>
<script>
const $=s=>document.querySelector(s), PAL=['#0f6e56','#d85a30','#378add','#ba7517','#993556','#639922','#7f77dd','#888780','#a32d2d','#1d9e75'];
const CAT=[["GSE133535","10X (2×5K cells, 250K reads)"],["GSE133536","10X (8×10K cells, 25K reads)"],["GSE141469","10X V3"],["GSE133537","C1HT medium"],["GSE133538","C1HT small"],["GSE133539","CEL-Seq2"],["GSE133540","Drop-seq"],["GSE133541","ICELL8"],["GSE133542","MARS-seq"],["GSE133543","Quartz-seq2"],["GSE133544","gmSCRB-seq"],["GSE133545","Smart-seq2"],["GSE133546","Single nuclei (sNuc-seq)"],["GSE133547","ddSEQ"],["GSE133548","inDrop"]];
// Input cells read from processed headers (genes×cells orientation); QC-pass from results.json
const INPUT=p=>(p.qc_dist&&p.qc_dist.input_cells)||p.cells_pass_qc;
const PAPER_RANK={"QUARTZseq2":1,"SMARTseq2":3,"CELseq2":4,"Dropseq":9,"inDrop":10,"MARSseq":12,"10X_2x5K_250K":2,"10X_8x10K_25K":2,"C1HT_medium":5,"C1HT_small":6,"ddSEQ":7,"SingleNuclei":8,"ICELL8":11,"gmSCRBseq":13}; // Fig.6 rank among 13. Both 10X V2 designs share rank 2 (Chromium V2); 10X_V3 postdates the paper, unranked.
const PAPER_N=13;
const demo=new URLSearchParams(location.search).has('demo'); let D=null, sortKey='median_genes', sortDir=-1;
const f2=v=>v==null?'–':v.toFixed(2), fi=v=>v==null?'–':Math.round(v).toLocaleString();
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function colOf(p){return PAL[D.protocols.indexOf(p)%PAL.length];}

function chartShell(id,title,inner,caption,details){return `<h2>${title}</h2><div class="card"><div class="figbox"><svg class="chart" id="${id}" viewBox="0 0 640 300" role="img">${inner}</svg></div><button class="btn" onclick="dlSvg('${id}','${id}.svg')">Download SVG</button><p class="figcap">${caption}</p>${details?`<details><summary>Methods &amp; provenance</summary>${details}</details>`:''}</div>`;}
function logTicks(lo,hi){const t=[];for(let e=Math.ceil(Math.log10(lo));e<=Math.floor(Math.log10(hi));e++)t.push(Math.pow(10,e));return t;}
function xLog(v,lo,hi,x0,x1){return x0+(Math.log10(v)-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo))*(x1-x0);}
function yLin(v,lo,hi,y0,y1){return y1-(v-lo)/(hi-lo)*(y1-y0);}

/* Fig R1: log-scale bars with axis */
function figLogBars(id,label,key,fmt){const P=[...D.protocols].sort((a,b)=>b[key]-a[key]);
  const vals=P.map(p=>p[key]),lo=Math.pow(10,Math.floor(Math.log10(Math.min(...vals)*0.9))),hi=Math.pow(10,Math.ceil(Math.log10(Math.max(...vals)*1.1)));
  const L={x0:150,x1:600,y0:20,rh:56},H=L.y0+P.length*L.rh+30;let s='';
  logTicks(lo,hi).forEach(t=>{const x=xLog(t,lo,hi,L.x0,L.x1);s+=`<line class="grid" x1="${x}" y1="${L.y0}" x2="${x}" y2="${H-30}"/><text x="${x}" y="${H-12}" text-anchor="middle">10${"⁰¹²³⁴⁵⁶".charAt(Math.round(Math.log10(t)))}</text>`;});
  P.forEach((p,i)=>{const y=L.y0+i*L.rh+8,x=xLog(p[key],lo,hi,L.x0,L.x1),c=colOf(p);
    s+=`<text x="${L.x0-8}" y="${y+16}" text-anchor="end" style="fill:var(--fg)">${esc(p.protocol)}</text><rect x="${L.x0}" y="${y}" width="${(x-L.x0).toFixed(1)}" height="20" rx="4" fill="${c}"><title>${esc(p.protocol)}: ${fmt(p[key])}</title></rect><text x="${x+6}" y="${y+15}">${fmt(p[key])}</text>`;});
  return {svg:s,H};}
function paintLogBars(id,label,key,fmt){const r=figLogBars(id,label,key,fmt);const el=document.getElementById(id);if(el){el.setAttribute('viewBox',`0 0 640 ${r.H}`);el.innerHTML=r.svg;}}

/* Fig R2: bubble scatter, log-log genes vs UMIs */
function figBubble(){const P=D.protocols,lo_x=Math.pow(10,Math.floor(Math.log10(Math.min(...P.map(p=>p.median_umis))*0.8))),hi_x=Math.pow(10,Math.ceil(Math.log10(Math.max(...P.map(p=>p.median_umis))*1.2)));
  const lo_y=Math.pow(10,Math.floor(Math.log10(Math.min(...P.map(p=>p.median_genes))*0.8))),hi_y=Math.pow(10,Math.ceil(Math.log10(Math.max(...P.map(p=>p.median_genes))*1.2)));
  const x0=70,x1=600,y0=20,y1=250;let s='';
  logTicks(lo_x,hi_x).forEach(t=>{const x=xLog(t,lo_x,hi_x,x0,x1);s+=`<line class="grid" x1="${x}" y1="${y0}" x2="${x}" y2="${y1}"/><text x="${x}" y="${y1+18}" text-anchor="middle">${t>=1000?(t/1000)+'k':t}</text>`;});
  logTicks(lo_y,hi_y).forEach(t=>{const yy=yLin(Math.log10(t),Math.log10(lo_y),Math.log10(hi_y),y0,y1);s+=`<line class="grid" x1="${x0}" y1="${yy}" x2="${x1}" y2="${yy}"/><text x="${x0-8}" y="${yy+4}" text-anchor="end">${t>=1000?(t/1000)+'k':t}</text>`;});
  s+=`<text x="${(x0+x1)/2}" y="292" text-anchor="middle">Median UMIs per cell (log scale)</text><text x="14" y="${(y0+y1)/2}" text-anchor="middle" transform="rotate(-90 14 ${(y0+y1)/2})">Median genes per cell (log)</text>`;
  const nmax=Math.max(...P.map(p=>p.cells_pass_qc));
  const pts=P.map(p=>({p,x:xLog(p.median_umis,lo_x,hi_x,x0,x1),y:yLin(Math.log10(p.median_genes),Math.log10(lo_y),Math.log10(hi_y),y0,y1),r:8+14*Math.sqrt(p.cells_pass_qc/nmax),c:colOf(p)}));
  pts.forEach(o=>{s+=`<circle cx="${o.x.toFixed(1)}" cy="${o.y.toFixed(1)}" r="${o.r.toFixed(1)}" fill="${o.c}" opacity="0.72"><title>${esc(o.p.protocol)}: ${fi(o.p.median_genes)} genes, ${fi(o.p.median_umis)} UMIs, n=${fi(o.p.cells_pass_qc)} QC-pass, stability ${o.p.stability_mean.toFixed(2)}</title></circle>`;});
  const placed=[];
  [...pts].sort((a,b)=>a.y-b.y).forEach(o=>{const nm=esc(o.p.protocol),w=nm.length*7+8;let side=o.x>x1-150?'L':'R',ly=o.y+4,lx=side==='R'?o.x+o.r+6:o.x-o.r-6-w;
    if(side==='L'&&lx<x0+4){side='R';lx=o.x+o.r+6;}
    for(let it=0;it<30;it++){const hit=placed.find(q=>Math.abs(q.ly-ly)<15&&lx<q.lx+q.w&&lx+w>q.lx);if(!hit)break;ly=hit.ly+15;}
    if(ly>y1-4)ly=y1-4;
    placed.push({ly,lx,w});
    const ax=side==='R'?o.x+o.r:o.x-o.r;
    if(Math.abs(ly-4-o.y)>2)s+=`<line x1="${ax.toFixed(1)}" y1="${o.y.toFixed(1)}" x2="${(side==='R'?lx-2:lx+w+2).toFixed(1)}" y2="${(ly-3).toFixed(1)}" stroke="${o.c}" stroke-width="1" opacity="0.6"/>`;
    s+=side==='R'?`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" style="fill:var(--fg);font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:3px">${nm}</text>`:`<text x="${(lx+w).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="end" style="fill:var(--fg);font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:3px">${nm}</text>`;});
  return s;}

/* Fig R3: QC retention */
function figRetention(){const P=[...D.protocols].sort((a,b)=>(b.cells_pass_qc/(INPUT(b)))-(a.cells_pass_qc/(INPUT(a))));
  const allv=P.flatMap(p=>[INPUT(p),p.cells_pass_qc]);let lo=Math.pow(10,Math.floor(Math.log10(Math.max(1,Math.min(...allv)*0.9)))),hi=Math.pow(10,Math.ceil(Math.log10(Math.max(...allv)*1.1)));
  const L={x0:150,x1:600,y0:20,rh:56},H=L.y0+P.length*L.rh+78;let s='';
  logTicks(lo,hi).forEach(t=>{const x=xLog(t,lo,hi,L.x0,L.x1);s+=`<line class="grid" x1="${x}" y1="${L.y0}" x2="${x}" y2="${H-64}"/><text x="${x}" y="${H-48}" text-anchor="middle">10${"⁰¹²³⁴⁵⁶".charAt(Math.round(Math.log10(t)))}</text>`;});
  P.forEach((p,i)=>{const y=L.y0+i*L.rh+4,inp=INPUT(p),w1=xLog(inp,lo,hi,L.x0,L.x1)-L.x0,w2=xLog(p.cells_pass_qc,lo,hi,L.x0,L.x1)-L.x0,c=colOf(p),ret=(100*p.cells_pass_qc/inp).toFixed(1),lbl=`${fi(p.cells_pass_qc)} (${ret}%)`;
    s+=`<text x="${L.x0-8}" y="${y+22}" text-anchor="end" style="fill:var(--fg)">${esc(p.protocol)}</text><rect x="${L.x0}" y="${y}" width="${w1.toFixed(1)}" height="16" rx="4" fill="none" stroke="${c}" stroke-dasharray="4 3"><title>${esc(p.protocol)} input: ${fi(inp)} cells</title></rect><rect x="${L.x0}" y="${y+20}" width="${w2.toFixed(1)}" height="16" rx="4" fill="${c}"><title>${esc(p.protocol)} QC-pass: ${fi(p.cells_pass_qc)} (${ret}% retained)</title></rect>`;
    s+=w2>150?`<text x="${(L.x0+w2-8).toFixed(1)}" y="${y+33}" text-anchor="end" style="fill:#fff;font-weight:600">${lbl}</text>`:`<text x="${(L.x0+w2+6).toFixed(1)}" y="${y+33}">${lbl}</text>`;});
  s+=`<g font-size="12"><rect x="${L.x0}" y="${H-28}" width="10" height="10" fill="none" stroke="var(--mut)"/><text x="${L.x0+14}" y="${H-18}">input cells</text><rect x="${L.x0+110}" y="${H-28}" width="10" height="10" fill="var(--ac)"/><text x="${L.x0+124}" y="${H-18}">pass QC (min_genes ≥ 200)</text></g>`;
  return {svg:s,H};}

/* Fig R4: stability with SD error bars */
function figStability(){const P=[...D.protocols].sort((a,b)=>b.stability_mean-a.stability_mean);const lo=0.5,hi=1.0,x0=150,x1=600,y0=20,rh=56,H=y0+P.length*rh+34;let s='';
  for(let v=lo;v<=hi+1e-9;v+=0.1){const x=x0+(v-lo)/(hi-lo)*(x1-x0);s+=`<line class="grid" x1="${x.toFixed(1)}" y1="${y0}" x2="${x.toFixed(1)}" y2="${H-30}"/><text x="${x.toFixed(1)}" y="${H-12}" text-anchor="middle">${v.toFixed(1)}</text>`;}
  P.forEach((p,i)=>{const y=y0+i*rh+22,x=x0+(p.stability_mean-lo)/(hi-lo)*(x1-x0),e=(p.stability_sd||0)/(hi-lo)*(x1-x0),c=colOf(p);
    s+=`<text x="${x0-8}" y="${y+4}" text-anchor="end" style="fill:var(--fg)">${esc(p.protocol)}</text><line x1="${(x-e).toFixed(1)}" y1="${y}" x2="${(x+e).toFixed(1)}" y2="${y}" stroke="${c}" stroke-width="2"/><line x1="${(x-e).toFixed(1)}" y1="${y-6}" x2="${(x-e).toFixed(1)}" y2="${y+6}" stroke="${c}" stroke-width="2"/><line x1="${(x+e).toFixed(1)}" y1="${y-6}" x2="${(x+e).toFixed(1)}" y2="${y+6}" stroke="${c}" stroke-width="2"/><circle cx="${x.toFixed(1)}" cy="${y}" r="6" fill="${c}"><title>${esc(p.protocol)}: ${p.stability_mean.toFixed(3)} ± ${p.stability_sd.toFixed(3)} (n=${D.config.stability_repeats} repeats)</title></circle><text x="${(x+e+8).toFixed(1)}" y="${y+4}">${p.stability_mean.toFixed(2)} ± ${p.stability_sd.toFixed(2)}</text>`;});
  return {svg:s,H};}

/* Fig R6-style benchmark dot plot (arithmetic-mean composite; paper used harmonic mean) */
function figDist(key,label){const P=[...D.protocols].sort((a,b)=>b.qc_dist[key][3]-a.qc_dist[key][3]);
 const all=P.flatMap(p=>p.qc_dist[key]);let lo=Math.pow(10,Math.floor(Math.log10(Math.max(1,Math.min(...all)*0.9)))),hi=Math.pow(10,Math.ceil(Math.log10(Math.max(...all)*1.1)));
 const x0=150,x1=600,y0=20,rh=64,H=y0+P.length*rh+56;let s='';

 glossary(){const G=[["UMI","Unique molecular identifier: random barcode ligated before amplification so PCR duplicates collapse to one molecule. Non-UMI protocols (Smart-seq2) count reads instead."],["Droplet vs plate-based","Droplet methods (Drop-seq, Chromium, inDrop, ddSEQ) encapsulate cells in oil droplets (high throughput, 3-prime biased); plate methods (Smart-seq2, CEL-seq2, Quartz-seq2, MARS-seq) sort cells into wells (fuller transcripts, lower throughput)."],["HVG","Highly variable genes: top-variance genes after normalisation (here 2,000) used for PCA; focuses signal on biology over noise."],["PCA / PC","Principal component analysis compresses 2,000 HVGs into 30 orthogonal axes (PCs) ordered by variance explained."],["kNN graph","k-nearest-neighbour graph (k=15) on PCs: each cell linked to its 15 closest neighbours; basis for Louvain clustering."],["Louvain / resolution","Community detection on the kNN graph; resolution (1.0) tunes granularity — higher values split more clusters."],["t-SNE / perplexity","t-distributed stochastic neighbour embedding for 2-D display only; perplexity (30 max) sets neighbourhood size. Plot distances are not quantitative."],["ARI","Adjusted Rand index: agreement between two clusterings, corrected for chance (1 = identical, about 0 = random). Our stability score."],["NMI","Normalised mutual information: shared information between clusterings in [0,1]; less sensitive to cluster number than ARI."],["Silhouette / ASW","Average silhouette width: cluster cohesion vs separation in [-1,1]. Paper Fig. 4b metric; needs reference labels."],["QC (min_genes, mito %)","Quality control keeps cells with 200+ detected genes and at most 20% mitochondrial reads (dying cells leak mito RNA). Mito filter is inert here (ENSEMBL IDs)."],["Doublet","Two cells captured as one event (e.g. human+mouse); the mixed-species design lets the paper exclude them."],["matchSCore2","Authors' marker-based projector assigning each cell a reference cell-type probability; p >= 0.5 kept, else 'unclassified'."],["HCA","Human Cell Atlas: consortium mapping all human cell types — the benchmark's motivating use case."],["GEO SuperSeries","GSE133549 groups 15 per-protocol SubSeries (GSE133535-48, GSE141469), each with count + metadata supplements."],["Downsampling","Equalising read depth (paper: 20K reads/cell via zUMIs) and cell numbers so protocols compare fairly."],["Dropout","Zero count for an expressed gene (technical non-detection); SCDE models it per cell as a function of expression level."],["Batch effect","Technical variation between runs/labs; kBET quantifies mixing failure when protocols are integrated."],["Library complexity","Number of distinct molecules/genes captured per cell — the main axis separating protocols (paper Fig. 2)."],["log1p / CP10K","Counts scaled to 10K per cell then log(1+x): variance-stabilises for PCA and clustering."],["Seed","Fixed random seed (0) makes subsampling, SVD, Louvain and t-SNE exactly reproducible."],["Marker gene","Gene preferentially expressed in one cluster; here the top 5 per Louvain community by (mean_in−mean_out)×fraction on log1p CP10K HVG values."],["Pearson r","Linear correlation of mean expression profiles in [−1,1]; 1 = identical ranking of gene levels."],["Cumulative curve","Union gene count as cells are added; steep early rise = high per-cell complexity."],["PCA scatter","Cells in PC1–PC2 space with per-component variance explained; global structure, unlike t-SNE/UMAP neighbourhoods."],["UMAP","Uniform manifold approximation: neighbourhood-preserving 2-D embedding; standard atlas overview (n_neighbors 15 here)."],["Feature plot","Embedding coloured by a per-cell quantity (genes/UMIs) instead of cluster id."],["Violin plot","Mirrored density of per-cell values (Gaussian KDE, Silverman rule) with IQR bar + median dot."],["Box plot","Quartiles with 1.5×IQR Tukey whiskers; here on log10 counts per cluster."],["Dot plot","Rows = genes, columns = clusters; dot size = fraction expressing, shade = mean expression. Compact marker heatmap."],["Composite score","Mean of normalised metrics ranking protocols (paper Fig. 6: harmonic mean of 6; here: arithmetic mean of 5 — see Benchmark note)."]];
 return `<div class="card note"><b>${G.length} terms.</b> Plain-language definitions for every technical term used on this dashboard.</div>`+G.map(g=>`<div class="card"><b>${g[0]}</b><br><span class="mut">${g[1]}</span></div>`).join('');},

  f.innerHTML='<ol style="margin:6px 0;padding-left:20px"><li><b>Complexity ranking broadly reproduces the paper (Fig. 6):</b> '+P.map(p=>esc(p.protocol)).join(' &gt; ')+' by median genes/cell ('+P.map(p=>fi(p.median_genes)).join(' / ')+').</li><li><b>Depth gap is large:</b> '+esc(g0.protocol)+' yields '+(g0.median_genes/g1.median_genes).toFixed(1)+'&times; the genes and '+(g0.median_umis/g1.median_umis).toFixed(1)+'&times; the UMIs of '+esc(g1.protocol)+' — on full-depth counts (paper: 20K-read equalised).</li><li><b>Efficiency paradox:</b> '+esc(eff.protocol)+' gives the most genes per 1K UMIs; the deepest protocol saturates fastest.</li><li><b>Retention ≠ complexity:</b> QC-pass rates span '+(100*rLo.cells_pass_qc/INPUT(rLo)).toFixed(1)+'% ('+esc(rLo.protocol)+') to '+(100*rHi.cells_pass_qc/INPUT(rHi)).toFixed(1)+'% ('+esc(rHi.protocol)+') — depth and cell quality are distinct axes.</li><li><b>Clusters are stable but unverified:</b> subsample ARI '+Math.min(...D.protocols.map(p=>p.stability_mean)).toFixed(2)+'–'+Math.max(...D.protocols.map(p=>p.stability_mean)).toFixed(2)+' with no reference labels, so accuracy vs cell types is unknown.</li>'+extra+'</ol>';}}}
const TRY=[];
async function load(url){TRY.push(url);const r=await fetch(url);if(!r.ok)throw new Error(url+' → HTTP '+r.status);return r.json();}
async function loadSpecies(sp){TRY.length=0;const S=SRC[sp];let last=new Error('not attempted');
 for(const u of S.urls){try{return {d:await load(u),src:u};}catch(e){last=e;}}
 const emb=window[S.emb];
 if(emb&&emb.protocols&&emb.protocols.length)return {d:emb,src:'embedded '+S.emb.toLowerCase()+'.js (offline fallback)'};
 throw last;}
async function setSpecies(sp){if(sp===SPECIES&&D&&D.protocols.length)return;SPECIES=sp;window.__tab=window.__tab||'overview';
 try{const r=await loadSpecies(sp);boot(r.d,r.src);}catch(e){fail(e);}}
function fail(e){$('#view').innerHTML=`<div class="warn">Could not load any data.</div><div class="card"><b>Diagnostics</b><br><span class="mut">Tried: ${TRY.map(esc).join(', ')||'fetch unavailable (file:// ?)'} · embedded fallback: ${(window.RESULTS&&window.RESULTS.protocols||[]).length} human / ${(window.RESULTS_MOUSE&&window.RESULTS_MOUSE.protocols||[]).length} mouse protocols · error: ${esc(String((e&&e.message)||e))}</span><br><br><b>Fixes:</b><ol><li>Serve the <code>site/</code> folder: from the repo root run <code>bash run.sh serve</code>, then open <code>http://localhost:8000</code>. Do <b>not</b> double-click index.html (<code>file://</code> blocks data loading).</li><li>Serving the repo root instead? Open <code>http://localhost:8000/site/</code>.</li><li>Preview layout with synthetic data: add <code>?demo</code> to the URL.</li></ol></div>`;}
(async()=>{try{
 if(demo){try{const r=await load('data/demo.json');return boot(r,'data/demo.json');}catch(e){if(window.DEMO&&window.DEMO.protocols.length)return boot(window.DEMO,'embedded demo.js (offline fallback)');throw e;}}
 const r=await loadSpecies(SPECIES);boot(r.d,r.src);
}catch(e){fail(e);}})();

function dlSvg(id,name){const el=document.getElementById(id);
 const vb=el.getAttribute('viewBox').split(' '),W=+vb[2],H=+vb[3];
 const inner=el.innerHTML.replace(/var\(--fg\)/g,'#1c1c1a').replace(/var\(--mut\)/g,'#6b6b66').replace(/var\(--ac\)/g,'#0f6e56').replace(/var\(--grid\)/g,'#dcdcd2').replace(/var\(--bg\)/g,'#ffffff').replace(/var\(--bd[12]?\)/g,'#e4e3dc');
 const doc='<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:12px;fill:#555}</style><rect width="'+W+'" height="'+H+'" fill="#ffffff"/>'+inner+'</svg>';const b=new Blob([doc],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
